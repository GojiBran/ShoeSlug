<html lang="en">

  <meta property="og:image" content="https://shoeslug.netlify.app/og-image.jpg" />

  <link rel="icon" type="image/png" href="https://shoeslug.netlify.app/favicon-96x96.png" sizes="96x96" />

  <link rel="shortcut icon" href="https://shoeslug.netlify.app/favicon.ico" />

  <!-- CSS libs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: linear-gradient(-45deg, #ff71ce, #01cdfe, #05ffa1, #b967ff, #fffb96);
      background-size: 400% 400%;
      animation: gradientShift 40s ease infinite;
      color: #fff;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .navbar-brand {
      font-weight: bold;
      background: linear-gradient(-45deg, #ff71ce, #01cdfe, #05ffa1, #b967ff, #fffb96);
      background-size: 400% 400%;
      animation: gradientShift 120s ease infinite;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      color: #ff71ce; text-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
    }
    .navbar-brand img { transition: transform .3s ease, filter .3s ease; }
    .navbar-brand img:hover { transform: rotate(-10deg) scale(1.1); filter: drop-shadow(0 0 4px #ff71ce); }

    .navbar-nav > li:nth-child(1) > .nav-link { color: #ff71ce !important; }
    .navbar-nav > li:nth-child(2) > .nav-link { color: #01cdfe !important; }
    .navbar-nav > li:nth-child(3) > .nav-link { color: #05ffa1 !important; }
    .navbar-nav > li:nth-child(4) > .nav-link { color: #b967ff !important; }
    .navbar-nav > li:nth-child(5) > .nav-link { color: #fffb96 !important; }
    .navbar-nav > li:nth-child(6) > .nav-link { color: #ff9966 !important; }
    .navbar-nav > li > .nav-link:hover { text-shadow: 0 0 6px currentColor, 0 0 12px currentColor; transition: all .3s ease; }
    .navbar-nav .nav-link.active { text-shadow: 0 0 6px currentColor, 0 0 12px currentColor, 0 0 18px currentColor; transition: all .3s ease; }

    .gallery-box {
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 40px rgba(255, 113, 206, 0.4), 0 0 80px rgba(1, 205, 254, 0.2);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      position: relative;
    }
    .swiper-button-next, .swiper-button-prev {
      color: #ff71ce; text-shadow: 0 0 6px #ff71ce, 0 0 12px #01cdfe;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 8px #ff71ce, 0 0 12px #01cdfe, 0 0 16px #05ffa1; }
      50% { box-shadow: 0 0 12px #ff71ce, 0 0 18px #01cdfe, 0 0 24px #05ffa1; }
      100% { box-shadow: 0 0 8px #ff71ce, 0 0 12px #01cdfe, 0 0 16px #05ffa1; }
    }
    .active-thumb img {
      box-shadow: 0 0 12px #ff71ce, 0 0 18px #01cdfe, 0 0 24px #05ffa1;
      border: 2px solid #fff; border-radius: 8px; animation: pulseGlow 2s infinite ease-in-out;
    }
    /* Accordion base (navbar-match polish can be added after this is stable) */
    .accordion-item { border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 1rem; overflow: hidden; }
    .accordion-button { background: rgba(0,0,0,0.45); color: #fff; }
    .accordion-button:not(.collapsed) { color: #fffbff; box-shadow: inset 0 -1px 0 rgba(255,255,255,0.1); }
    .accordion-body { background: transparent; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="https://shoeslug.netlify.app/">
        <img src="https://shoeslug.netlify.app/favicon-96x96.png" alt="Shoe Slug Logo" width="32" height="32" style="image-rendering: crisp-edges;" />
        <span>Shoe Slug</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="https://shoeslug.netlify.app/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="https://shoeslug.netlify.app/music/">Music</a></li>
          <li class="nav-item"><a class="nav-link" href="https://shoeslug.netlify.app/videos/">Videos</a></li>
          <li class="nav-item"><a class="nav-link active" href="https://shoeslug.netlify.app/gallery/">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="https://shoeslug.netlify.app/about/">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- GALLERY: Category Accordion -->
  <div class="container py-4">
    <div class="accordion" id="galleryAccordion">
      <!-- Sections injected via JS -->
    </div>
  </div>

  <!-- SOCIAL LINKS -->
  <section class="py-5 bg-black text-center">
    <div class="container">
      <h2 class="gradient-text mb-3">Connect with Me</h2>
      <div class="social-icons mt-3">
        <a href="https://www.youtube.com/@shoeslug" target="_blank" title="YouTube"><i class="bi bi-youtube"></i></a>
        <a href="https://open.spotify.com/artist/24RpTxky0ibb9ixlyRcLCm" target="_blank" title="Spotify"><i class="bi bi-spotify"></i></a>
        <a href="https://music.apple.com/us/artist/shoe-slug/1820615534" target="_blank" title="Apple Music"><i class="bi bi-apple-music"></i></a>
        <a href="https://www.pandora.com/artist/shoe-slug/ARmmrdthwf9zp69" target="_blank" title="Pandora"><i class="bi bi-broadcast"></i></a>
        <a href="https://soundcloud.com/shoeslug" target="_blank" title="SoundCloud"><i class="bi bi-soundwave"></i></a>
        <a href="https://www.instagram.com/shoesluggg/" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="https://www.facebook.com/RisAngelo333" target="_blank" title="Facebook"><i class="bi bi-facebook"></i></a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 <a href="mailto:2shoeslug@gmail.com">Shoe Slug</a>. All rights reserved.</p>
  </footer>

  <!-- JS libs (Bootstrap bundle includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fslightbox@3.4.1/index.min.js"></script>

  <!-- App script (defensive) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ---- Config ----
      const CATEGORIES = [
        { folder: 'inktober 2024',    count: 31 },
        { folder: 'glitch',    count: 8  },
        { folder: 'canvas',    count: 6  },
        { folder: 'portraits', count: 7  },
      ];
      const BASE = 'https://shoeslug.netlify.app/gallery/images';

      // ---- Safe feature detection ----
      const hasBootstrap = !!(window.bootstrap && bootstrap.Collapse);
      const hasSwiper    = !!window.Swiper;
      const hasFsLb      = typeof window.refreshFsLightbox === 'function';

      const accRoot = document.getElementById('galleryAccordion');
      const swipers = new Map();
      let activeFolder = null;

      const toTitleCase = (slug) => slug.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

      function sectionHTML({ folder, count }, index) {
        const headerId   = `heading-${folder}`;
        const collapseId = `collapse-${folder}`;
        const lightboxKey= `gallery-${folder}`;
        let slides = '', thumbs = '';
        for (let i = 0; i < count; i++) {
          const full  = `${BASE}/${folder}/image${i}.jpg`;
          const thumb = `${BASE}/${folder}/resize/image${i}.jpg`;
          const alt   = `${toTitleCase(folder)} ${i + 1}`;
          slides += `
            <div class="swiper-slide">
              <a data-fslightbox="${lightboxKey}" href="${full}">
                <img src="${full}" loading="lazy" alt="${alt}" class="img-fluid rounded w-100" style="max-height: 70vh; object-fit: contain;" />
              </a>
            </div>`;
          thumbs += `
            <div class="col-4 col-sm-3 col-md-2 col-lg-2">
              <a id="${folder}-thumb-${i}" href="${full}" title="${alt}">
                <div class="zoom-thumb">
                  <img src="${thumb}" loading="lazy" alt="${alt}" class="img-fluid rounded shadow-sm" style="object-fit: cover;" />
                </div>
              </a>
            </div>`;
        }
        return `
          <div class="accordion-item mb-3 gallery-box rounded-4" id="cat-${folder}">
            <h2 class="accordion-header" id="${headerId}">
              <button class="accordion-button ${index===0?'':'collapsed'}" type="button"
                data-bs-toggle="collapse" data-bs-target="#${collapseId}"
                aria-expanded="${index===0?'true':'false'}" aria-controls="${collapseId}">
                <span class="me-2">🎨</span> ${toTitleCase(folder)} <span class="ms-2 small opacity-75">(${count})</span>
              </button>
            </h2>
            <div id="${collapseId}" class="accordion-collapse collapse ${index===0?'show':''}" aria-labelledby="${headerId}" data-bs-parent="#galleryAccordion">
              <div class="accordion-body">
                <div class="swiper mainSwiper mb-3" id="swiper-${folder}" tabindex="0" style="outline:none">
                  <div class="swiper-wrapper">${slides}</div>
                  <div class="swiper-button-next"></div>
                  <div class="swiper-button-prev"></div>
                </div>
                <div class="row g-2 pt-2 justify-content-center" id="${folder}-thumbGrid">${thumbs}</div>
              </div>
            </div>
          </div>`;
      }

      // Inject sections
      CATEGORIES.forEach((c, i) => accRoot.insertAdjacentHTML('beforeend', sectionHTML(c, i)));

      // Initialize FS Lightbox safely
      if (hasFsLb) {
        try { refreshFsLightbox(); } catch (e) { console.warn('FS Lightbox init warning:', e); }
      }

      // Create swipers (if lib missing, page still works without them)
      CATEGORIES.forEach(({ folder, count }, idx) => {
        const swiperEl = document.getElementById(`swiper-${folder}`);

        let sw = null;
        if (hasSwiper) {
          try {
            sw = new Swiper(swiperEl, {
              spaceBetween: 10,
              loop: count > 1,
              speed: 800,
              autoplay: { delay: 12000, disableOnInteraction: true },
              navigation: {
                nextEl: swiperEl.querySelector('.swiper-button-next'),
                prevEl: swiperEl.querySelector('.swiper-button-prev'),
              },
              on: {
                init()        { setActiveThumb(folder, this.realIndex); maybeUpdateHash(folder, this.realIndex); },
                slideChange() { setActiveThumb(folder, this.realIndex); maybeUpdateHash(folder, this.realIndex); }
              }
            });
          } catch (e) {
            console.warn('Swiper init failed for', folder, e);
          }
        }

        // Thumb click -> slideTo or just scroll if no Swiper
        for (let i = 0; i < count; i++) {
          const a = document.getElementById(`${folder}-thumb-${i}`);
          if (!a) continue;
          a.addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (sw && typeof sw.slideToLoop === 'function') {
              sw.slideToLoop(i, 500);
              setActiveThumb(folder, i);
              maybeUpdateHash(folder, i);
            } else {
              // no swiper: open lightbox or just jump hash
              window.location.hash = `#${folder}:${i}`;
            }
            smoothScrollToPanel(swiperEl.closest('.accordion-item'));
          });
        }

        swipers.set(folder, sw);
        if (idx === 0) activeFolder = folder;
      });

      function setActiveThumb(folder, index) {
        document.querySelectorAll(`#${folder}-thumbGrid a`).forEach(a => a.classList.remove('active-thumb'));
        const a = document.getElementById(`${folder}-thumb-${index}`);
        if (a) a.classList.add('active-thumb');
      }

      function smoothScrollToPanel(panel) {
        const navbar = document.querySelector('.navbar');
        if (!panel || !navbar) return;
        const top = panel.getBoundingClientRect().top + window.pageYOffset - navbar.offsetHeight - 12;
        window.scrollTo({ top, behavior: 'smooth' });
      }

      // Keyboard arrows on active section
      document.addEventListener('keydown', (e) => {
        if (!activeFolder) return;
        const tag = (e.target && e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return;
        const sw = swipers.get(activeFolder);
        if (!sw) return;
        if (e.key === 'ArrowRight') sw.slideNext && sw.slideNext();
        if (e.key === 'ArrowLeft')  sw.slidePrev && sw.slidePrev();
      });

      // Accordion behavior: Bootstrap if present, fallback otherwise
      const accEl = document.getElementById('galleryAccordion');

      if (hasBootstrap) {
        accEl.addEventListener('shown.bs.collapse', (e) => {
          const folder = e.target.id.replace(/^collapse-/, '');
          activeFolder = folder;
          swipers.forEach((sw, f) => {
            if (sw && sw.autoplay) (f === folder ? sw.autoplay.start() : sw.autoplay.stop());
          });
          const container = document.getElementById(`swiper-${folder}`);
          container && container.focus && container.focus();
          maybeUpdateHash(folder, null);
        });
        accEl.addEventListener('hidden.bs.collapse', (e) => {
          const folder = e.target.id.replace(/^collapse-/, '');
          const sw = swipers.get(folder);
          sw && sw.autoplay && sw.autoplay.stop();
        });
      } else {
        // Fallback accordion toggle
        accEl.querySelectorAll('.accordion-button').forEach(btn => {
          btn.addEventListener('click', () => {
            const targetSel = btn.getAttribute('data-bs-target');
            const target = targetSel ? document.querySelector(targetSel) : null;
            if (!target) return;

            // close others
            accEl.querySelectorAll('.accordion-collapse.show').forEach(open => {
              if (open !== target) open.classList.remove('show');
            });

            target.classList.toggle('show');

            // update activeFolder + autoplay
            const folder = (target.id || '').replace(/^collapse-/, '');
            activeFolder = folder;
            swipers.forEach((sw, f) => {
              if (sw && sw.autoplay) (f === folder ? sw.autoplay.start() : sw.autoplay.stop());
            });

            // focus
            const container = document.getElementById(`swiper-${folder}`);
            container && container.focus && container.focus();
            maybeUpdateHash(folder, null);
          });
        });
      }

      // Sync with FS Lightbox (if present)
      if (hasFsLb) {
        document.addEventListener('fsLightboxOpen', () => {
          const sw = activeFolder && swipers.get(activeFolder);
          sw && sw.autoplay && sw.autoplay.stop();
        });
        document.addEventListener('fsLightboxClose', () => {
          const sw = activeFolder && swipers.get(activeFolder);
          sw && sw.autoplay && sw.autoplay.start();
        });
      }

      // Deep-linking (#folder[:index]) with graceful fallback
      function parseHash() {
        const raw = (window.location.hash || '').replace(/^#/, '').trim();
        if (!raw) return null;
        const [folder, idxRaw] = raw.split(':');
        const index = Number.isFinite(+idxRaw) ? Math.max(0, +idxRaw) : null;
        return { folder, index };
      }
      function openFolder(folder) {
        const collapse = document.getElementById(`collapse-${folder}`);
        if (!collapse) return false;
        try {
          if (hasBootstrap) {
            bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false }).show();
          } else {
            // fallback
            accEl.querySelectorAll('.accordion-collapse.show').forEach(el => el.classList.remove('show'));
            collapse.classList.add('show');
          }
          return true;
        } catch (e) { console.warn('Open folder failed', folder, e); return false; }
      }
      function maybeUpdateHash(folder, index) {
        if (!folder) return;
        const current = parseHash();
        const idxPart = (typeof index === 'number') ? `:${index}` : '';
        const nextHash = `#${folder}${idxPart}`;
        if (!current || current.folder !== folder || (typeof index === 'number' && current.index !== index)) {
          try { history.replaceState(null, '', nextHash); } catch {}
        }
      }

      // on load: apply deep link
      requestAnimationFrame(() => {
        const deep = parseHash();
        if (deep && openFolder(deep.folder)) {
          const sw = swipers.get(deep.folder);
          if (sw && typeof deep.index === 'number') {
            const max = sw.slides ? sw.slides.length : 0;
            const idx = max ? Math.min(Math.max(deep.index, 0), max - 1) : deep.index;
            sw.slideToLoop && sw.slideToLoop(idx, 0);
            setActiveThumb(deep.folder, idx);
          }
          smoothScrollToPanel(document.getElementById(`cat-${deep.folder}`));
        } else {
          // default autoplay state
          swipers.forEach((sw, f) => {
            if (!sw || !sw.autoplay) return;
            (f === activeFolder) ? sw.autoplay.start() : sw.autoplay.stop();
          });
        }
      });

    });
  </script>
</body>
</html>
